name: Aggiorna rating federgolf
on:
  schedule:
    - cron: '17 5 * * 1'   # ogni lunedì mattina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/aggiorna-rating.js
      - run: |
          git config user.name "aggiorna-rating"
          git config user.email "actions@users.noreply.github.com"
          git add ratings.json ratings.js
          git diff --cached --quiet || (git commit -m "Rating federgolf aggiornati" && git push)
